name: Docker
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - svc-gateway
          - svc-multipass
          - svc-ontology
          - svc-objects
          - svc-actions
          - svc-datasets
          - svc-compass
          - svc-admin
          - svc-functions
          - svc-webhooks
          - svc-media
          - svc-sentinel
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lowercase image repository
        # ghcr.io rejects any uppercase letter in a repository name, and
        # github.repository carries the owner login verbatim (Przyval). Derive
        # the lowercase name here rather than hardcoding the owner, so the tag
        # stays correct if the repository is ever transferred.
        run: echo "IMAGE_REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
